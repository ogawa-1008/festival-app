name: Deploy to Xserver

on:
  push:
    branches:
      - main

  # 手で実行するときは「dry_run」にチェックすると、サーバーにつながるかと何を置くかだけを確かめる（ファイルは変えない）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "サーバーを変えずに、つながるかと置くファイルだけ確かめる"
        type: boolean
        default: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. GitHubリポジトリを取得
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 2. Node.jsをセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # 3. frontendの依存関係をインストール
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 4. Reactアプリをビルド
      - name: Build application
        working-directory: frontend
        run: npm run build

      # 5. ビルド結果を確認
      - name: Check build output
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "ERROR: frontend/dist directory was not found."
            exit 1
          fi

          if [ -z "$(ls -A frontend/dist)" ]; then
            echo "ERROR: frontend/dist is empty."
            exit 1
          fi

          echo "Build completed successfully."
          ls -la frontend/dist/

      # 6. Tailscale につなぐ
      #    Xserver の FTP は、踏み台サーバー（sarashiya）の IP からしか受け付けない。
      #    sessapps の headscale に参加して、踏み台経由（サブネットルート）で Xserver に届くようにする。
      #    TS_AUTHKEY は headscale の管理者が発行した、何度も使えて終わったら消える（reusable・ephemeral）キー
      - name: Connect to Tailscale
        # キーを渡すので、中身が勝手に変わらないようコミットで固定する
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # サブネットルートを受ける --accept-routes は、このアクションが自分で付ける（二重に書くとエラーになる）
          args: --login-server=https://headscale.sessapps.com
          hostname: github-actions-deploy

      # 7. FTP で一覧を取れるか確かめる
      #    踏み台を通っていないと、ログインできても一覧が空になる（IP 制限）。
      #    そのまま進むと、何も置けないか、失敗が分かりにくくなるため、ここで止める
      - name: Check FTP access
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # パスワードをコマンドの引数に出さないよう、netrc に書いて curl に渡す
          netrc="$RUNNER_TEMP/ftp-netrc"
          ( umask 077; printf 'machine %s login %s password %s\n' "$FTP_HOST" "$FTP_USERNAME" "$FTP_PASSWORD" > "$netrc" )

          # サブネットルートが届くまで少しかかることがあるので、何回か試す
          for attempt in 1 2 3 4 5; do
            if listing=$(curl --silent --show-error --ssl-reqd --list-only --max-time 30 \
                --netrc-file "$netrc" "ftp://$FTP_HOST/vantan-monhan-festival.com/" | tr -d '\r') \
              && grep -qx "public_html" <<<"$listing"; then
              rm -f "$netrc"
              echo "FTP: public_html が見えました"
              exit 0
            fi
            echo "FTP の一覧を取れませんでした（$attempt 回目）"
            if [ "$attempt" -lt 5 ]; then sleep 10; fi
          done

          rm -f "$netrc"
          echo "::error::Xserver の FTP で一覧を取れません。Tailscale の接続（TS_AUTHKEY・サブネットルート）か、FTP のユーザー名・パスワードを確かめてください"
          exit 1

      # 8. アプリをXserverへFTPでデプロイ
      - name: Deploy to Xserver
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          dry-run: ${{ inputs.dry_run == true }}
          server-dir: /vantan-monhan-festival.com/public_html/
          local-dir: frontend/dist/
