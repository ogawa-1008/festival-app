name: Deploy to Xserver

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. GitHubリポジトリを取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.jsをセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. frontendの依存関係をインストール
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 4. Reactアプリをビルド
      - name: Build application
        working-directory: frontend
        run: npm run build

      # 5. ビルド結果を確認
      - name: Check build output
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "ERROR: frontend/dist directory was not found."
            exit 1
          fi

          if [ -z "$(ls -A frontend/dist)" ]; then
            echo "ERROR: frontend/dist is empty."
            exit 1
          fi

          echo "Build completed successfully."
          ls -la frontend/dist/

      # 6. API（backend）用の PHP をセットアップ（Xserver と同じ 8.3）
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      # 7. API の依存関係をインストール（本番で使うものだけ。vendor/ はリポジトリにないのでここで作る）
      - name: Install API dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      # 8. API を XserverへFTPでデプロイ（ブラウザから見えない public_html の外に置く）
      #    DB の接続情報（.env）はサーバーに手で置く。GitHub には載せない
      - name: Deploy API to Xserver
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /vantan-monhan-festival.com/festival-api/
          local-dir: backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.example
            README.md

      # 9. アプリをXserverへFTPでデプロイ
      - name: Deploy to Xserver
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /vantan-monhan-festival.com/public_html/
          local-dir: frontend/dist/
